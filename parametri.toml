# =====================================================================
#  PARAMETRI STANDARD DELL'APP  -  da aggiornare periodicamente
#  L'app rilegge questo file a ogni modifica: non serve riavviarla.
#  Usare il punto come separatore decimale (0.28, non 0,28).
# =====================================================================

[meta]
aggiornamento = "ottobre 2026"
versione = "2.1"                 # versione dello strumento (mostrata nel piè di pagina)
data_versione = "25/10/2026"
fonte = "Stime di mercato da verificare (preventivi installatori, prezzi ARERA, GSE)"

[costi]
fv_eur_kwp = 1500.0          # impianto FV residenziale chiavi in mano, IVA inclusa, €/kWp
batteria_eur_kwh = 400.0     # accumulo, €/kWh nominale installato
batteria_fisso_eur = 1500.0  # quota fissa batteria (inverter ibrido, installazione)
manutenzione_eur_kwp_anno = 15.0

[energia]
prezzo_prelievo = 0.28       # €/kWh tutto compreso (energia + rete + oneri + imposte)
valore_immissione = 0.09     # €/kWh riconosciuto all'energia immessa (RID / prezzo zonale)

[finanza]
orizzonte_anni = 20          # durata della valutazione
tasso_sconto = 0.03          # rendimento alternativo del denaro (es. titoli di Stato)
inflazione_energia = 0.02    # crescita annua del prezzo dell'energia
degrado_fv = 0.005           # perdita di produzione annua dei moduli
vita_batteria_anni = 15      # dopo questi anni la batteria si sostituisce
costo_sostituzione = 0.5     # costo di sostituzione / costo batteria di oggi

[batteria]
dod = 0.90                   # capacità utile / nominale
rendimento = 0.92            # round-trip
c_rate = 0.5                 # potenza max = c_rate x capacità nominale
potenza_min_kw = 2.5         # potenza minima dell'inverter batteria

[fv]
perdite = 14                 # perdite di sistema PVGIS, %
inclinazione_falda = 30      # gradi, modalità base "tetto a falda"
inclinazione_piano = 10      # gradi, modalità base "tetto piano"
m2_per_kwp = 5.5             # superficie di tetto per kWp (moduli + distanze)
kwp_max_base = 10.0          # potenza massima proposta in modalità base
pvgis_anno_inizio = 2014
pvgis_anno_fine = 2023

[analisi]
soglia_ginocchio = 1.5       # punti % di autosufficienza per kWh di batteria
passo_batteria_kwh = 2.5     # passo della griglia di capacità
batteria_max_kwh = 20.0

# ---------------------------------------------------------------------
#  INCENTIVI  -  valori validi OGGI. Aggiornare quando cambia la norma.
#  rate = numero di quote annuali; massimali facoltativi.
#  avviso = testo mostrato sotto la scelta (lasciare "" per non mostrarlo).
#  valido_dal / valido_al = periodo di validità (date AAAA-MM-GG, facoltative).
#  Dopo valido_al l'app avvisa che il valore va verificato.
# ---------------------------------------------------------------------
[incentivi.detrazione_principale]
nome = "Detrazione fiscale – abitazione principale"
percentuale = 0.50
valido_dal = 2026-01-01
valido_al = 2026-12-31
rate = 10
massimale_spesa = 96000
descrizione = """Bonus casa: recuperi una parte della spesa come minori tasse IRPEF, in 10 rate \
annuali uguali. Vale per fotovoltaico e batteria installati insieme. Serve avere ogni anno \
abbastanza IRPEF da cui detrarre."""
avviso = """A legge attuale dal 1° gennaio 2027 la detrazione scende al 36%, salvo proroga nella \
legge di bilancio. Conta la data del pagamento (bonifico), non quella dell'installazione."""

[incentivi.detrazione_altre]
nome = "Detrazione fiscale – altra abitazione"
percentuale = 0.36
valido_dal = 2026-01-01
valido_al = 2026-12-31
rate = 10
massimale_spesa = 96000
descrizione = "Come la precedente, con aliquota ridotta per le abitazioni diverse dalla principale."
avviso = "A legge attuale dal 1° gennaio 2027 la detrazione scende al 30%, salvo proroga."

[incentivi.conto_termico]
nome = "Conto Termico 3.0 (solo con pompa di calore)"
percentuale = 0.20                # DA VERIFICARE sul DM CT 3.0
valido_al_testo = "fino a esaurimento delle risorse"   # in alternativa a valido_al
rate = 1
massimale_fv_kwp = 1500
massimale_batt_kwh = 1000
descrizione = """Contributo GSE accreditato sul conto. Per i privati il fotovoltaico con accumulo è \
ammesso solo se installato insieme alla sostituzione del riscaldamento con una pompa di calore \
elettrica. Non cumulabile con le detrazioni."""
avviso = ""

[incentivi.nessuno]
nome = "Nessun incentivo"
percentuale = 0.0
rate = 1
descrizione = "Investimento interamente a carico."
avviso = ""

# ---------------------------------------------------------------------
[giudizio]                   # soglie per il giudizio sul preventivo
produzione_bassa = 0.6       # produzione annua / consumo annuo sotto cui il FV è "piccolo"
produzione_alta = 1.3        # sopra cui il FV è "grande"

[app]
url_istruzioni = "https://climaction.it/calcolatore-fotovoltaico/"   # pagina WordPress di presentazione
url_sito = "https://climaction.it/"                          # il logo rimanda qui
url_vetrina_cer = "https://www.gse.it/servizi-per-te/autoconsumo/vetrina-delle-cer"   # Vetrina delle CER del GSE (ricerca per POD)
logo = "assets/logo_climaction.png"             # logo climaction (intestazione, piè di pagina, PDF, icona)
firma = "Ing. Marco Cigolotti"

